<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ | CMEC E-Borrow App</title>
<link rel="icon" href="/logo/Logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
  <section class="login-hero">
    <img class="logo-lg" src="/logo/Logo.jpg" alt="CMEC logo">
    <h1>CMEC E-Borrow App</h1>
    <p>ระบบยืม-คืนหุ่นและอุปกรณ์ simulation สำหรับบุคลากรโรงพยาบาลและศูนย์แพทย์</p>
  </section>
  <section class="login-box">
    <form class="login-card" id="f">
      <span class="role-tag">สำหรับผู้ใช้งาน</span>
      <h1>เข้าสู่ระบบ</h1>
      <p style="color:var(--muted);margin-top:0">กรอกชื่อผู้ใช้และรหัสผ่านที่ได้รับจากศูนย์ CMEC</p>
      <div class="field"><label for="u">ชื่อผู้ใช้</label><input id="u" autocomplete="username" required autofocus></div>
      <div class="field"><label for="p">รหัสผ่าน</label><input id="p" type="password" autocomplete="current-password" required></div>
      <div class="err" id="err"></div>
      <button class="btn block" type="submit">เข้าสู่ระบบ</button>
      <div class="switch">เป็นผู้ดูแลระบบ? <a href="/admin-login.html">เข้าสู่ระบบ Admin</a></div>
    </form>
  </section>
</div>
<script src="/js/login.js" data-portal="user"></script>
</body>
</html>
